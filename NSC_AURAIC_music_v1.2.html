  try {

    return false;
  }
};

const generateUniqueCode = () => {

// ==========================================
const Interactive3DBackground = ({ primaryColor = '#f97316', secondaryColor = '#fbbf24' }) => {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let animationFrameId;

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    const handleResize = () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', handleResize);

    const mouse = { x: width / 2, y: height / 2, targetX: width / 2, targetY: height / 2 };
    const handleMouseMove = (e) => {
      mouse.targetX = e.clientX;
      mouse.targetY = e.clientY;
    };
    window.addEventListener('mousemove', handleMouseMove);

    const hexToRgb = (hex) => {
      const clean = String(hex || '#f97316').replace('#', '');
      const full = clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean;
      const n = parseInt(full, 16);
      if (Number.isNaN(n)) return { r: 249, g: 115, b: 22 };
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    };
    const primaryRgb = hexToRgb(primaryColor);
    const secondaryRgb = hexToRgb(secondaryColor);
    const particleCount = Math.min(Math.floor((width * height) / 14000), 75);
    const particles = Array.from({ length: particleCount }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      z: Math.random() * 1000 + 1,
      radius: Math.random() * 2 + 1,
      color: Math.random() > 0.35 ? `rgba(${primaryRgb.r}, ${primaryRgb.g}, ${primaryRgb.b}, ` : `rgba(${secondaryRgb.r}, ${secondaryRgb.g}, ${secondaryRgb.b}, `,
      alpha: Math.random() * 0.5 + 0.2,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4
    }));

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const render = () => {
      mouse.x += (mouse.targetX - mouse.x) * 0.05;
      mouse.y += (mouse.targetY - mouse.y) * 0.05;

      ctx.clearRect(0, 0, width, height);

      // Grid Pattern
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
      ctx.lineWidth = 1;
      const gridSize = 65;
      const offsetX = (mouse.x * 0.02) % gridSize;
      const offsetY = (mouse.y * 0.02) % gridSize;

      for (let x = offsetX; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = offsetY; y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Cursor Ambient Orange Glow
      const radialGradient = ctx.createRadialGradient(
        mouse.x, mouse.y, 0,
        mouse.x, mouse.y, Math.max(width, height) * 0.45
      );
      radialGradient.addColorStop(0, `rgba(${primaryRgb.r}, ${primaryRgb.g}, ${primaryRgb.b}, 0.12)`);
      radialGradient.addColorStop(0.5, `rgba(${primaryRgb.r}, ${primaryRgb.g}, ${primaryRgb.b}, 0.03)`);
      radialGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = radialGradient;
      ctx.fillRect(0, 0, width, height);

      // Particles
      particles.forEach((p) => {
        if (!prefersReducedMotion) {
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;
        }

        const parallaxX = (mouse.x - width / 2) * (90 / p.z);
        const parallaxY = (mouse.y - height / 2) * (90 / p.z);

        ctx.beginPath();
        ctx.arc(p.x + parallaxX, p.y + parallaxY, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `${p.color}${p.alpha})`;
        ctx.fill();
      });

      animationFrameId = requestAnimationFrame(render);
    };

    render();

    return () => {
      window.removeEventListener('resize', handleResize);
      window.removeEventListener('mousemove', handleMouseMove);
      cancelAnimationFrame(animationFrameId);
    };
  }, [primaryColor, secondaryColor]);

  return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />;
};

  // Registration Submission
  const handleRegisterSubmit = async (e) => {
    e.preventDefault();

    if (!settings.isOpen) {
      showToast("Registration is currently closed by the administrator.", "warning");
      return;
    }

    if (!regForm.fullName || !regForm.email || !regForm.phone || !regForm.school || !regForm.category || !regForm.projectName || !regForm.trxId) {
      showToast("Please fill in all required fields marked with *", "error");
      return;
    }

    const cleanTrx = regForm.trxId.trim().toUpperCase();

    const duplicateTrx = participants.find(p => p.trxId && p.trxId.toUpperCase() === cleanTrx);
    if (duplicateTrx) {
      showToast(`Transaction ID '${cleanTrx}' has already been submitted for Registration ${duplicateTrx.regId}!`, "error");
      return;
    }

    setIsSubmitting(true);

    try {
      let assignedRegId = "";
      const timestamp = Date.now();

      // Generate a unique registration ID for every participant.
      // The ID is checked against Supabase before insert, so it remains
      // unique even when registrations arrive from different devices.
      const generateRegistrationId = () => {
        const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
        const bytes = new Uint32Array(10);
        if (window.crypto && window.crypto.getRandomValues) {
          window.crypto.getRandomValues(bytes);
        } else {
          for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 0xffffffff);
        }
        let token = '';
        for (let i = 0; i < bytes.length; i++) token += chars[bytes[i] % chars.length];
        return `NSF26-${token}`;
      };

      for (let attempt = 0; attempt < 12; attempt++) {
        const candidate = generateRegistrationId();
        const alreadyInMemory = participants.some(item => String(item.regId || '') === candidate);
        if (alreadyInMemory) continue;

        if (!isDevMode && isSupabaseConfigured) {
          const { data: existingCode, error: codeCheckError } = await supabase
            .from('registration')
            .select('registration_code')
            .eq('registration_code', candidate)
            .maybeSingle();
          if (codeCheckError) throw codeCheckError;
          if (existingCode) continue;
        }

        assignedRegId = candidate;
        break;
      }

      if (!assignedRegId) {
        throw new Error('Could not generate a unique registration code. Please try again.');
      }
      const newRecord = {
        regId: assignedRegId, fullName: regForm.fullName.trim(), email: regForm.email.trim(),
        phone: regForm.phone.trim(), school: regForm.school.trim(), studentClass: regForm.studentClass.trim(),
        category: regForm.category, projectName: regForm.projectName.trim(), teamMembers: regForm.teamMembers.trim(),
        extraNotes: regForm.extraNotes.trim(), trxId: cleanTrx, paymentStatus: 'PENDING',
        verificationCode: null, checkInStatus: 'NOT_CHECKED_IN', createdAt: timestamp, updatedAt: timestamp
      };
      if (!isDevMode && isSupabaseConfigured) {
        const { error } = await supabase.from('registration').insert(participantToRow(newRecord));
        if (error) throw error;
      } else {
        setParticipants(prev => [newRecord, ...prev]);
      }

      setLastRegistered({
        regId: assignedRegId,
        fullName: regForm.fullName,
        trxId: cleanTrx,
        category: regForm.category
      });

      setRegForm({
        fullName: '', email: '', phone: '', school: '', studentClass: '',
        category: '', projectName: '', teamMembers: '', extraNotes: '', trxId: ''
      });
      showToast(`Registration Successful! ID: ${assignedRegId}`, "success");
      recordAuditLog("REGISTRATION_CREATED", assignedRegId, `Participant ${regForm.fullName} registered.`);
    } catch (err) {
      console.error("Registration submission failure:", err);
      showToast("Submission failed. Please try again.", "error");
    } finally {
      setIsSubmitting(false);
    }

  const handleStatusSearch = async (e) => {

          .limit(1);

        if (error) throw error;
        if (data && data.length > 0) match = dbRowToParticipant(data[0]);
      } else {
        match = participants.find(p =>
          String(p.regId || '').toUpperCase() === term ||
          String(p.verificationCode || '').toUpperCase() === term ||
          String(p.trxId || '').toUpperCase() === term

      if (match) {

                className="flex-1 py-3 bg-rose-500 hover:bg-rose-400 text-white font-black text-xs uppercase rounded-xl transition-all shadow-lg shadow-rose-500/30 font-['Anton']"
              >
                Confirm Rejection
              </button>
            </div>
          </div>
        </div>
      )}

      {/* RESET ALL REGISTRATIONS — PASSWORD CONFIRMATION MODAL */}
      {resetModalOpen && (
        <div className="fixed inset-0 z-[60] bg-black/90 backdrop-blur-2xl flex items-center justify-center p-4 animate-fadeIn">
          <div className="bg-zinc-900 border border-rose-500/40 rounded-3xl p-7 max-w-md w-full space-y-6 shadow-2xl relative">
            <button
              onClick={() => { setResetModalOpen(false); setResetPass(''); }}
              className="absolute top-4 right-4 text-zinc-400 hover:text-white"
              disabled={settingsSyncing}
            >
              <X className="w-5 h-5" />
            </button>

            <div className="text-center space-y-3">
              <div className="w-16 h-16 bg-rose-500/10 border border-rose-500/40 rounded-2xl flex items-center justify-center mx-auto text-rose-400">
                <Trash2 className="w-8 h-8" />
              </div>
              <h3 className="text-2xl font-black text-white font-['Anton'] uppercase">Reset All Registrations</h3>
              <p className="text-xs text-rose-300 leading-relaxed">
                WARNING: This permanently deletes all registration records from the database. This action cannot be undone.
              </p>
              <div className="text-sm font-black text-white">
                Current records: <span className="text-rose-400">{participants.length}</span>
              </div>
            </div>

            <form
              onSubmit={(e) => { e.preventDefault(); executeResetAllRegistrations(); }}
              className="space-y-4"
            >
              <label className="text-xs text-zinc-400 block">Re-enter Admin Password to continue</label>
              <input
                type="password"
                required
                autoFocus
                value={resetPass}
                onChange={e => setResetPass(e.target.value)}
                placeholder="Admin password"
                className="w-full bg-black/60 border border-rose-500/20 rounded-xl px-4 py-3.5 text-sm text-white focus:border-rose-500 focus:outline-none"
              />

              <div className="flex gap-3">
                <button
                  type="button"
                  onClick={() => { setResetModalOpen(false); setResetPass(''); }}
                  disabled={settingsSyncing}
                  className="flex-1 py-3 bg-white/10 hover:bg-white/20 disabled:opacity-40 text-white font-bold text-xs uppercase rounded-xl transition-all"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={settingsSyncing}
                  className="flex-1 py-3 bg-rose-500 hover:bg-rose-400 disabled:opacity-40 text-white font-black text-xs uppercase rounded-xl transition-all shadow-lg shadow-rose-500/30 font-['Anton']"
                >
                  {settingsSyncing ? 'RESETTING...' : 'DELETE EVERYTHING'}
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* Admin Login Modal */}
      {adminModalOpen && (
        <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-2xl flex items-center justify-center p-4 animate-fadeIn">
          <div className="bg-zinc-900 border border-white/10 rounded-3xl p-8 max-w-sm w-full space-y-6 shadow-2xl relative">
            <button
              onClick={() => setAdminModalOpen(false)}
              className="absolute top-4 right-4 text-zinc-400 hover:text-white"
            >
              <X className="w-5 h-5" />
            </button>

            <div className="text-center space-y-2">
              <div className="w-14 h-14 bg-orange-500/10 border border-orange-500/30 rounded-2xl flex items-center justify-center mx-auto text-orange-400">
                <Lock className="w-7 h-7" />
              </div>
              <h3 className="text-2xl font-black text-white font-['Anton'] uppercase">Admin Authentication</h3>
              <p className="text-xs text-zinc-400">Enter administrator access password</p>
            </div>

            <form onSubmit={handleAdminLogin} className="space-y-4">
              <input
                type="password"
                required
                placeholder="Enter administrator password"
                value={adminPass}
                onChange={e => setAdminPass(e.target.value)}
                className="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3.5 text-sm text-white focus:border-orange-500 focus:outline-none"
              />
              <button
                type="submit"
                className="w-full py-3.5 bg-orange-500 hover:bg-orange-400 text-black font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg shadow-orange-500/30 font-['Anton']"
              >
                Access Command Center
              </button>
            </form>
          </div>
        </div>
      )}

      {/* Footer */}
      <footer className="border-t border-white/10 py-8 mt-20 relative z-10 text-center text-xs text-zinc-500 space-y-1">
        <p>{settings.footerLine1 || "© ORGANISED BY AURAIC. All rights reserved."}</p>
        <p>{settings.footerLine2 || "SUNNY"}</p>
        <p>{settings.footerLine3 || "BYZID"}</p>
      </footer>
    </div>
  );
}



createRoot(document.getElementById('root')).render(<App />);

<!-- BACKGROUND MUSIC SYSTEM — ONLY ADDITION -->
<script>
  const BACKGROUND_YOUTUBE_URL = "https://youtu.be/bP9gMpl1gyQ";

  (function () {
    let player = null;
    let playerReady = false;
    let started = false;

    const match = BACKGROUND_YOUTUBE_URL.match(
      /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([^?&/]+)/i
    );
    const videoId = match ? match[1] : null;
    if (!videoId) return;

    // Create the YouTube player before the user's first interaction.
    // It stays in a valid embedded-player viewport; controls are disabled.
    const host = document.createElement("div");
    host.id = "background-youtube-player";
    host.style.cssText =
      "position:fixed;right:0;bottom:0;width:200px;height:200px;z-index:1;opacity:0.01;pointer-events:none;";
    document.body.appendChild(host);

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("background-youtube-player", {
        width: "200",
        height: "200",
        videoId: videoId,
        playerVars: {
          autoplay: 0,
          controls: 0,
          playsinline: 1,
          rel: 0,
          loop: 1,
          playlist: videoId,
          modestbranding: 1
        },
        events: {
          onReady: function (event) {
            playerReady = true;
            event.target.setVolume(100);
          }
        }
      });
    };

    const api = document.createElement("script");
    api.src = "https://www.youtube.com/iframe_api";
    api.async = true;
    document.head.appendChild(api);

    function startMusicFromUserGesture() {
      if (started) return;

      // The click/tap itself is the user gesture. Once the API player
      // is ready, this starts unmuted playback.
      if (playerReady && player) {
        started = true;
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }
    }

    ["pointerdown", "touchstart", "click", "keydown"].forEach(function (eventName) {
      document.addEventListener(eventName, startMusicFromUserGesture, true);
    });
  })();
</script>
<!-- END BACKGROUND MUSIC SYSTEM -->
